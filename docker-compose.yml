services:
  postgres:
    image: pgvector/pgvector:pg16          # Postgres + pgvector extension
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vali
    ports: ["5432:5432"]
  rabbitmq:
    image: rabbitmq:4-management           # UI at http://localhost:15672 (guest/guest)
    ports: ["5672:5672", "15672:15672"]
